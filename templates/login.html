<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTEMIS // Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg:      #0a0d14;
    --surface: #0f1420;
    --surface2:#141926;
    --accent:  #1a4a7a;
    --accent2: #1e5a94;
    --text:    #e8eaf0;
    --dim:     #4a6a8a;
    --border:  #1e2d45;
    --error:   #c84c63;
    --warning: #b07d2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    padding: 24px;
  }

  .login-wrap { width: 100%; max-width: 400px; text-align: center; }

  /* ── Logo ── */
  .logo-block { margin-bottom: 28px; }
  .logo-block img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    display: block;
    margin: 0 auto 16px;
  }
  .brand-name {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--text);
  }
  .brand-sub {
    font-size: 0.72rem;
    color: var(--dim);
    margin-top: 5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .accent-line {
    height: 2px;
    background: linear-gradient(90deg, transparent, #1a4a7a, #2a6aaa, #1a4a7a, transparent);
  }
  .card-header {
    padding: 13px 22px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: left;
  }
  .card-body { padding: 24px 22px; }

  /* ── Form ── */
  .field { margin-bottom: 16px; text-align: left; }
  .field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--dim);
    margin-bottom: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .field input {
    width: 100%;
    background: #ffffff;
    border: 1px solid #c8d8e8;
    border-radius: 10px;
    color: #0f1826;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input::placeholder { color: #8aaabb; }
  .field input:focus {
    border-color: #4a7aaa;
    box-shadow: 0 0 0 3px rgba(74,122,170,0.15);
  }

  /* ── Notices ── */
  .notice-expired {
    background: rgba(176,125,42,0.1);
    border: 1px solid rgba(176,125,42,0.3);
    border-radius: 8px;
    color: #d4a44a;
    font-size: 0.8rem;
    padding: 10px 14px;
    margin-bottom: 16px;
    text-align: left;
    line-height: 1.5;
  }
  .notice-expired::before { content: '⚠  '; }

  .error-msg {
    background: rgba(200,76,99,0.1);
    border: 1px solid rgba(200,76,99,0.3);
    border-radius: 8px;
    color: #e87a8a;
    font-size: 0.82rem;
    padding: 10px 12px;
    margin-top: 14px;
    text-align: center;
  }

  /* ── Button ── */
  .btn-login {
    width: 100%;
    margin-top: 8px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #e8f4ff;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-login:hover  { background: var(--accent2); }
  .btn-login:active { filter: brightness(0.95); }

  /* ── Footer ── */
  .footer-note {
    margin-top: 20px;
    font-size: 0.68rem;
    color: #1e2d45;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .brand-name { font-size: 1.5rem; }
    .logo-block img { width: 160px; height: 160px; }
    .card-body { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="login-wrap">

  <div class="logo-block">
    <img src="/static/artemis_login_logo.png" alt="Artemis Logo">
    <div class="brand-name">ART3MIS</div>
    <div class="brand-sub">External Pentest Suite</div>
  </div>

  <div class="card">
    <div class="accent-line"></div>
    <div class="card-header">Authorized Access Only</div>
    <div class="card-body">
      <form method="POST" action="/login">

        {% if expired %}
        <div class="notice-expired">
          Your session expired after 3 hours. Please log in again.
        </div>
        {% endif %}

        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" name="username"
                 autocomplete="username" autofocus
                 placeholder="Enter your username">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password"
                 autocomplete="current-password"
                 placeholder="Enter your password">
        </div>

        <button type="submit" class="btn-login">Sign In</button>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

      </form>
    </div>
  </div>

  <div class="footer-note">Retrobyte Cybersecurity LLC // Confidential System</div>
</div>
</body>
</html>
