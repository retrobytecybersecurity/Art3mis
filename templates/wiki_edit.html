<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTEMIS // Wiki Edit — {{ article.title }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{--bg:#0a0d14;--surface:#0f1420;--surface2:#141926;--accent:#1a4a7a;--text:#e8eaf0;--dim:#4a6a8a;--border:#1e2d45;--shadow:0 2px 12px rgba(0,0,0,0.3);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);flex-shrink:0}
  .logo{font-size:1rem;font-weight:700;color:var(--text);letter-spacing:.1em}
  .article-name{font-size:0.82rem;color:var(--dim);margin-left:12px}
  .nav-btn{font-size:12px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);cursor:pointer;text-decoration:none;transition:all 0.15s;display:inline-block}
  .nav-btn:hover{border-color:#2a4a6a;color:var(--text)}
  .btn-save{padding:8px 20px;border-radius:8px;border:none;background:var(--accent);color:#e8f4ff;font-family:'Inter',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;transition:filter 0.15s}
  .btn-save:hover{filter:brightness(1.15)}
  .btn-preview{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-family:'Inter',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.15s}
  .btn-preview.active{border-color:#2a4a7a;color:#5a9acc;background:rgba(26,74,122,0.15)}

  .editor-wrap{flex:1;display:flex;overflow:hidden}

  /* Editor pane */
  .pane-editor{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
  .pane-header{padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:0.7rem;font-weight:600;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;flex-shrink:0}
  #md-editor{flex:1;background:var(--surface);color:#c8d4e0;font-family:'JetBrains Mono',monospace;font-size:0.84rem;line-height:1.7;padding:16px;border:none;outline:none;resize:none;tab-size:2}
  #md-editor::selection{background:rgba(26,74,122,0.4)}

  /* Preview pane */
  .pane-preview{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .preview-body{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}

  /* Markdown preview styles — same as wiki_article */
  .wiki-content{line-height:1.8;font-size:0.9rem}
  .wiki-content h1{font-size:1.3rem;font-weight:700;color:var(--text);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .wiki-content h1:first-child{margin-top:0}
  .wiki-content h2{font-size:1rem;font-weight:600;color:#8ab8d8;margin:20px 0 8px}
  .wiki-content h3{font-size:0.9rem;font-weight:600;color:var(--dim);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .wiki-content p{margin-bottom:10px;color:#c8d4e0}
  .wiki-content strong{color:var(--text);font-weight:600}
  .wiki-content a{color:#5a9acc}
  .wiki-content ul,.wiki-content ol{margin:6px 0 10px 18px;color:#c8d4e0}
  .wiki-content li{margin-bottom:3px}
  .wiki-content code{font-family:'JetBrains Mono',monospace;font-size:0.8rem;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:#8ab8d8}
  .wiki-content pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto;margin:10px 0}
  .wiki-content pre code{background:none;border:none;padding:0;color:#8ab8d8}
  .wiki-content table{width:100%;border-collapse:collapse;margin:10px 0;font-size:0.8rem}
  .wiki-content th{background:var(--surface2);color:#8ab8d8;font-weight:600;padding:7px 10px;text-align:left;border:1px solid var(--border);font-size:0.74rem;text-transform:uppercase}
  .wiki-content td{padding:7px 10px;border:1px solid var(--border);color:#c8d4e0}
  .wiki-content tr:nth-child(even) td{background:rgba(255,255,255,0.02)}

  #toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:8px;font-size:0.8rem;font-family:'Inter',sans-serif;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:999;font-weight:500}
  #toast.show{opacity:1}
  #toast.success{background:rgba(42,122,74,0.2);border:1px solid #2a5a3a;color:#4aaa6a}
  #toast.error{background:rgba(138,42,58,0.2);border:1px solid #5a1a2a;color:#e88a9a}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <div class="logo">◈ ART3MIS — Wiki</div>
    <span class="article-name">/ {{ article.title }}</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-preview" id="preview-toggle" onclick="togglePreview()">Preview</button>
    <button class="btn-save" onclick="saveArticle()">Save Article</button>
    <a href="/wiki/{{ slug }}" class="nav-btn">← Cancel</a>
  </div>
</header>

<div class="editor-wrap">
  <div class="pane-editor">
    <div class="pane-header">Markdown Editor</div>
    <textarea id="md-editor" spellcheck="false" oninput="updatePreview()">{{ article.content }}</textarea>
  </div>
  <div class="pane-preview" id="preview-pane" style="display:none">
    <div class="pane-header">Live Preview</div>
    <div class="preview-body">
      <div class="wiki-content" id="preview-content"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let previewOpen = false;

function togglePreview() {
  previewOpen = !previewOpen;
  const pane = document.getElementById('preview-pane');
  const btn  = document.getElementById('preview-toggle');
  pane.style.display = previewOpen ? 'flex' : 'none';
  pane.style.flexDirection = 'column';
  btn.classList.toggle('active', previewOpen);
  if (previewOpen) updatePreview();
}

function updatePreview() {
  if (!previewOpen) return;
  const content = document.getElementById('md-editor').value;
  document.getElementById('preview-content').innerHTML = marked.parse(content);
}

function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `show ${type}`;
  setTimeout(() => { el.className = ''; }, 3000);
}

async function saveArticle() {
  const content = document.getElementById('md-editor').value;
  const res = await fetch('/wiki/{{ slug }}/edit', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ content }),
  });
  const data = await res.json();
  if (data.ok) {
    toast('✓ Article saved.');
  } else {
    toast('Save failed.', 'error');
  }
}

// Tab key inserts spaces instead of changing focus
document.getElementById('md-editor').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end   = this.selectionEnd;
    this.value  = this.value.substring(0, start) + '  ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 2;
    updatePreview();
  }
  // Ctrl+S to save
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveArticle();
  }
});
</script>
</body>
</html>
